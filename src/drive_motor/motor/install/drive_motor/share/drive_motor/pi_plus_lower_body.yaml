# Pi Plus 下半身 12 电机配置
# 用于完整机器人部署

drive_motor_node:
  ros__parameters:
    motor_count: 12
    can_device: "/dev/ttyACM0"
    can_baudrate: 1000000
    loop_rate: 500
    kp_default: 80.0
    kd_default: 1.0

    joint_names:
      - "l_hip_pitch_joint"
      - "l_hip_roll_joint"
      - "l_hip_yaw_joint"
      - "l_knee_joint"
      - "l_ankle_pitch_joint"
      - "l_ankle_roll_joint"
      - "r_hip_pitch_joint"
      - "r_hip_roll_joint"
      - "r_hip_yaw_joint"
      - "r_knee_joint"
      - "r_ankle_pitch_joint"
      - "r_ankle_roll_joint"

    # 机械限位 [pi_plus 标准值]
    joint_lower_limits:
      - -1.57   # l_hip_pitch
      - -1.22   # l_hip_roll
      - -0.79   # l_hip_yaw
      - -2.44   # l_knee
      - -1.13   # l_ankle_pitch
      - -0.61   # l_ankle_roll
      - -1.57   # r_hip_pitch
      - -0.79   # r_hip_roll
      - -0.79   # r_hip_yaw
      - -2.44   # r_knee
      - -1.13   # r_ankle_pitch
      - -0.61   # r_ankle_roll

    joint_upper_limits:
      - 1.57
      - 0.79
      - 0.79
      - 0.61
      - 1.13
      - 0.61
      - 1.57
      - 1.22
      - 0.79
      - 0.61
      - 1.13
      - 0.61